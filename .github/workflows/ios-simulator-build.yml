name: Build iOS Simulator App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build for iOS Simulator & Appetize.io
    runs-on: macos-13 # Universally supported on all GitHub free accounts

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: Build iOS Simulator App
        run: |
          xcodebuild build \
            -project MakeTheMost.xcodeproj \
            -scheme MakeTheMost \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Simulator App into ZIP
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "MakeTheMost.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: MakeTheMost.app not found in build directory!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r -X "${GITHUB_WORKSPACE}/MakeTheMost-Simulator.app.zip" MakeTheMost.app
          echo "Created MakeTheMost-Simulator.app.zip successfully"

      - name: Upload Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakeTheMost-Simulator-App
          path: MakeTheMost-Simulator.app.zip
          retention-days: 14
